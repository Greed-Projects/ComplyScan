name: Verify Vercel package hotfix

on:
  push:
    branches:
      - vercel-python-package-hotfix

jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install ".[dev]"
      - run: python -m pip check
      - run: python -c "import fastapi; from app.main import app; print(fastapi.__version__); print(app.title)"
      - run: python -W error::DeprecationWarning -W error::FutureWarning -m pytest -q
