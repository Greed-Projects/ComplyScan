name: Verify Vercel CORS

on:
  push:
    branches:
      - vercel-preview-cors

jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -W error::DeprecationWarning -W error::FutureWarning -m pytest -q
