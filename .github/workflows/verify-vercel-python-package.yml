name: Verify Vercel Python package

on:
  push:
    branches:
      - vercel-python-dependencies

jobs:
  backend-package:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools

      - name: Install backend from pyproject
        run: python -m pip install ".[dev]"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Verify Vercel entrypoint imports
        run: python -c "import fastapi; from app.main import app; print(fastapi.__version__); print(app.title)"

      - name: Run backend tests
        run: python -W error::DeprecationWarning -W error::FutureWarning -m pytest -q
