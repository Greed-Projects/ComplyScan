name: Verify headless OpenCV runtime

on:
  push:
    branches:
      - vercel-headless-opencv

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools

      - name: Install backend package
        run: python -m pip install ".[dev]"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Prepare Vercel headless OpenCV
        if: runner.os == 'Linux'
        run: VERCEL=1 python scripts/prepare_vercel_runtime.py

      - name: Verify Linux cv2 binary has no libGL dependency
        if: runner.os == 'Linux'
        shell: bash
        run: |
          CV2_SO="$(python -c 'import pathlib, cv2; print(next(pathlib.Path(cv2.__path__[0]).glob("cv2*.so")))')"
          echo "cv2 native module: $CV2_SO"
          ldd "$CV2_SO"
          if ldd "$CV2_SO" | grep -q "libGL\.so"; then
            echo "Headless OpenCV validation failed: libGL dependency remains."
            exit 1
          fi

      - name: Verify OpenCV, PaddleX and FastAPI imports
        run: >-
          python -c "import cv2, fastapi;
          from paddlex.utils.deps import is_dep_available;
          assert is_dep_available('opencv-contrib-python');
          from paddleocr import TextRecognition;
          from app.main import app;
          print(cv2.__version__);
          print(fastapi.__version__);
          print(TextRecognition.__name__);
          print(app.title)"

      - name: Run backend tests
        run: python -W error::DeprecationWarning -W error::FutureWarning -m pytest -q
