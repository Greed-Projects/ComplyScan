name: Verify headless OpenCV runtime

on:
  push:
    branches:
      - vercel-headless-opencv

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools

      - name: Install backend package
        run: python -m pip install ".[dev]"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Verify OpenCV and FastAPI imports
        run: >-
          python -c "import cv2, fastapi;
          from app.main import app;
          print(cv2.__version__);
          print(fastapi.__version__);
          print(app.title)"

      - name: Run backend tests
        run: python -W error::DeprecationWarning -W error::FutureWarning -m pytest -q
