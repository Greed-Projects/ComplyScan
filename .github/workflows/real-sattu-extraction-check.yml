name: Real Sattu extraction check

on:
  push:
    branches:
      - field-extraction-hardening

jobs:
  real-sattu-regression:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install focused dependencies
        run: python -m pip install fastapi==0.116.1 pytest==8.4.2

      - name: Run real Sattu extraction regressions
        run: >-
          python -m pytest -q
          tests/test_extraction.py
          tests/test_spatial_extraction.py
          tests/test_analyzer.py
          tests/test_inspection.py
